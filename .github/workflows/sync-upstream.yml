name: Sync upstream pstack

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: cursor/plugins branch, tag, or commit
        default: main

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A sync takes under a minute. Without a limit, a hung fetch holds the runner for GitHub's default 6 hours.
    timeout-minutes: 10
    steps:
      # The commit the run was queued on can be stale by the time it runs; sync from the branch tip.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync upstream/
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: node scripts/sync-upstream.mjs "$REF"

      # Fails when upstream changes its Claude Code adapter, drops a skill the omp tree needs, or uses a Cursor name
      # that adapter/omp.md has no row for. Nothing is pushed then.
      - name: Generate omp tree
        run: node scripts/generate-omp-tree.mjs

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed upstream."
            exit 0
          fi
          version=$(node -p 'require("./release.json").version')
          commit=$(node -p 'require("./upstream/UPSTREAM.json").commit.slice(0, 12)')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync upstream pstack $version (cursor/plugins@$commit)"
          # `git add` honours upstream's .gitignore, so make sure the commit holds every upstream file.
          objects=$(node -p 'Object.entries(require("./upstream/UPSTREAM.json").objects).map((entry) => entry.join(" ")).join("\n")')
          while read -r path id; do
            test "$(git rev-parse "HEAD:upstream/$path")" = "$id" ||
              { echo "The commit lost files from upstream/$path. Not pushing."; exit 1; }
          done <<< "$objects"
          git push
