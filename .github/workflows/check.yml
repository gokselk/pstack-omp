name: Check omp tree

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated omp tree
        run: node scripts/generate-omp-tree.mjs --check

      - name: Check upstream/ is upstream's, unedited
        run: |
          objects=$(node -p 'Object.entries(require("./upstream/UPSTREAM.json").objects).map((entry) => entry.join(" ")).join("\n")')
          while read -r path id; do
            test "$(git rev-parse "HEAD:upstream/$path")" = "$id" ||
              { echo "upstream/$path differs from its object in upstream/UPSTREAM.json. Run node scripts/sync-upstream.mjs."; exit 1; }
          done <<< "$objects"
